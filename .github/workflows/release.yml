name: build
on: [push, pull_request]

jobs:
  build_on_win:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        # Electron 43 and Electron Forge 8 need Node 22.13 or newer to build
        node-version: 22
    - name: generate release tag
      id: tag
      # the build time without leading zeros, but at least one digit per part (00:00 becomes 0)
      run: |
        $version = (Get-Date -Format 'yy.MMdd.HHmm') -replace '\.0+(?=\d)', '.'
        echo "release_tag=$version" >> $Env:GITHUB_OUTPUT
        (Get-Content package.json).replace('"version": "1.0.0"', """version"": ""$version""") | Set-Content package.json
    - name: install dependencies
      run: npm ci
    - name: build
      run: npm run make -- --arch=ia32
    # every published release is installed by the terminals, pull requests only get a test build
    - name: release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        files: "out/make/*/*/*"
        tag_name: ${{ steps.tag.outputs.release_tag }}
    # the installer of any other build, to try it out on a terminal by hand
    - name: test build
      if: "!(github.event_name == 'push' && github.ref == 'refs/heads/main')"
      uses: actions/upload-artifact@v4
      with:
        name: label-terminal-${{ steps.tag.outputs.release_tag }}
        path: "out/make/*/*/*"
